name: LuminaPlayer
options:
  bundleIdPrefix: com.lumina
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  LuminaPlayer:
    type: application
    platform: iOS
    sources:
      - path: LuminaPlayer
    settings:
      base:
        PRODUCT_NAME: LuminaPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.player
        INFOPLIST_FILE: LuminaPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
